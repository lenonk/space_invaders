<svg xmlns="http://www.w3.org/2000/svg" width="72" height="32" viewBox="0 0 72 32">
  <rect width="72" height="32" fill="none"/>
  <!-- Wide dome -->
  <rect x="20" y="7" width="32" height="9" rx="4.5" fill="#B23434"/>
  <!-- Wide/thick hull -->
  <rect x="8" y="16" width="56" height="11" rx="5.5" fill="#8E2A2A"/>
  <!-- Belly plate -->
  <rect x="12" y="22" width="48" height="4" rx="2" fill="#7A2323"/>
  <!-- Cockpit slit -->
  <rect x="28" y="11" width="16" height="2" fill="#F0CACA"/>
  <!-- Panel seams -->
  <rect x="18" y="18" width="36" height="1" fill="#621C1C"/>
  <rect x="14" y="20" width="44" height="1" fill="#621C1C"/>
  <!-- Emissive ports -->
  <circle cx="18" cy="20.5" r="1.3" fill="#5CFFE8" opacity="0.75"/>
  <circle cx="54" cy="20.5" r="1.3" fill="#5CFFE8" opacity="0.75"/>
  <!-- Underglow band -->
  <rect x="20" y="25" width="32" height="2" rx="1" fill="#5CFFE8" opacity="0.32"/>
</svg>
